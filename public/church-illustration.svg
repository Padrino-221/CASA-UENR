<svg width="800" height="800" viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="800" fill="transparent"/>
  
  <!-- Modern Minimalist Chapel Illustration -->
  <g opacity="0.9">
    <!-- Main Body -->
    <path d="M200 600H600V400L400 250L200 400V600Z" fill="white" fill-opacity="0.05"/>
    <path d="M200 600H600V400L400 250L200 400V600Z" stroke="white" stroke-opacity="0.2" stroke-width="2"/>
    
    <!-- Central Steeple / Tower -->
    <path d="M380 250H420V100L400 60L380 100V250Z" fill="white" fill-opacity="0.1"/>
    <path d="M380 250H420V100L400 60L380 100V250Z" stroke="white" stroke-opacity="0.3" stroke-width="2"/>
    
    <!-- Abstract Cross -->
    <path d="M400 80V140" stroke="#1E67FC" stroke-width="4" stroke-linecap="round"/>
    <path d="M385 110H415" stroke="#1E67FC" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Large Round Window -->
    <circle cx="400" cy="380" r="40" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.2" stroke-width="2"/>
    <path d="M400 340V420" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
    <path d="M360 380H440" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
    
    <!-- Entrance Arch -->
    <path d="M360 600V520C360 497.909 377.909 480 400 480V480C422.091 480 440 497.909 440 520V600" fill="white" fill-opacity="0.1" stroke="white" stroke-opacity="0.3" stroke-width="2"/>
    
    <!-- Side Architectural Fins -->
    <path d="M200 600V450L160 500V600H200Z" fill="white" fill-opacity="0.03" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
    <path d="M600 600V450L640 500V600H600Z" fill="white" fill-opacity="0.03" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
    
    <!-- Abstract Steps -->
    <path d="M300 600H500" stroke="white" stroke-opacity="0.2" stroke-width="4" stroke-linecap="round"/>
    <path d="M250 620H550" stroke="white" stroke-opacity="0.1" stroke-width="2" stroke-linecap="round"/>
    <path d="M200 640H600" stroke="white" stroke-opacity="0.05" stroke-width="1" stroke-linecap="round"/>
  </g>
  
  <!-- Ambient Light Rays -->
  <g opacity="0.5">
    <path d="M400 60L100 800" stroke="url(#paint0_linear)" stroke-width="1" stroke-opacity="0.2"/>
    <path d="M400 60L700 800" stroke="url(#paint1_linear)" stroke-width="1" stroke-opacity="0.2"/>
  </g>

  <defs>
    <linearGradient id="paint0_linear" x1="400" y1="60" x2="100" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="white"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paint1_linear" x1="400" y1="60" x2="700" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="white"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
